# ==============================================================================
# 被测应用环境配置 (Multi-App Configuration)
# 支持方式 1: 直接修改 active_app 为 "zhaiwan" 或 "liwutong" (极简无感秒切)
# 支持方式 2: 使用下方的 apps 列表，或者注释/解开注释对应的配置块
# ==============================================================================
active_app: "zhaiwan"   # 当前激活测试的目标软件: "zhaiwan" (寨湾) 或 "liwutong" (里伍铜)

apps:
  # ----------------------------------------------------------------------------
  # 方案一：寨湾矿山大屏项目 (Zhaiwan)
  # ----------------------------------------------------------------------------
  zhaiwan:
    exe_path: "D:\\LargeScreen\\zhaiwan2\\project\\se-launcher-zhaiwan\\se-launcher-zhaiwan.exe"
    rules_file: "docs/explore_rules_zhaiwan.md"  # 👈 寨湾矿山大屏专属探索规矩与菜单基准
    debug_port: 9223
    ue_process_name: "zhaiwan.exe"       # 伴生 UE 进程镜像名 (若不设或为空则不检测)
    expected_page_url: "main.html"       # 目标大屏主页面 URL 关键字
    expected_page_title: "主界面"         # 目标大屏主页面标题关键字
    startup_timeout: 40.0                # UE 启动与页面跳转最大容忍时间(秒)
    start_delay: 15.0                    # 页面就绪后的 UI 稳定缓冲时间(秒)
    no_proxy: "127.0.0.1,localhost,192.168.1.97,221.234.48.197,::1" # 代理白名单
    viewport:
      width: 2560
      height: 1440
      device_pixel_ratio: 1.5
    # 前置环境准入巡检 (防止在旧测试环境或过期前端包跑通宵)
    env_check:
      enabled: true
      expected_env: "prod"     # 期望环境: "prod" 或 "test"
      strict: true             # true: 环境不匹配时直接阻断退出；false: 仅打印告警
      # expected_frontend: ""  # 可选: 校验前端包目录是否包含指定关键字 (例如 "dist(9-21)")
      environments:
        prod: "http://221.234.48.197:8808"
        test: "http://121.43.58.203:8783"

  # ----------------------------------------------------------------------------
  # 方案二：里伍铜矿山大屏项目 (Liwutong)
  # ----------------------------------------------------------------------------
  liwutong:
    exe_path: "D:\\LargeScreen\\liwutong\\se-launcher-liwutong\\se-launcher-liwutong.exe"
    rules_file: "docs/explore_rules_liwutong.md" # 👈 里伍铜矿山大屏专属探索规矩与菜单基准
    debug_port: 9223
    ue_process_name: "liwutong.exe"      # 伴生 UE 进程镜像名
    expected_page_url: "main.html"       # 目标大屏主页面 URL 关键字 (端口 9529)
    expected_page_title: "主界面"         # 目标大屏主页面标题关键字
    startup_timeout: 40.0                # UE 启动与页面跳转最大容忍时间(秒)
    start_delay: 15.0                    # 页面就绪后的 UI 稳定缓冲时间(秒)
    no_proxy: "127.0.0.1,localhost,192.168.1.97,221.234.48.197,::1" # 代理白名单
    viewport:
      width: 2560
      height: 1440
      device_pixel_ratio: 1.5
    # 前置环境准入巡检
    env_check:
      enabled: false           # 里伍铜 默认暂不强制开启，可按需启用
      expected_env: "prod"
      strict: false
      environments:
        prod: "http://10.126.126.2:8809"

explorer:
  max_planner_failures: 8    # Planner 连续规划失败安全熔断上限 (防止死锁)
  max_tokens: 1024           # 视觉规划单次输出 Token 上限
  max_retries: 3             # 大模型通信异常自动重试次数
  step_timeout: 300           # Worker 单步操作最大超时保护(秒)，超时强杀僵死弹窗/进程并安全冷重启

llm:
  provider: "openai" # 使用 OpenAI 兼容模式
  api_key: ""        # 请在 .env 文件中配置 LLM_API_KEY，此处留空以防泄露
  base_url: "https://dashscope.aliyuncs.com/compatible-mode/v1"
  model: "qwen3-vl-plus"
  bug_analysis_model: "qwen3-vl-plus" # 缺陷归因与根因排查专属模型 (通义高智商旗舰多模态，后台异步执行不影响主流程速度)
  timeout: 60        # 单次大模型调用超时保障(秒)
  temperature: 0.1   # 模型采样温度 (控制视觉定位稳定性)

reports:
  dir: "reports"
  sync_docs: false       # 是否同步更新动态架构树至 docs/ 目录 (默认 false，保护文档目录纯净)
  feishu_webhook: "https://open.feishu.cn/open-apis/bot/v2/hook/c7c57a81-0bb1-4af0-b7e2-2d0fbf53d62e" # 飞书群机器人推送地址
  feishu_secret: "Uo84rXzarL4FQqsiRQNI6e" # 飞书签名密钥
  report_base_url: "http://192.168.1.156" # 外部访问报告的基础 URL (如 IIS 服务地址)

zentao:
  url: "http://192.140.163.129:8080" # 禅道系统根地址
  account: "guoxiaoqi"               # 提单账号
  default_product_id: 10             # 默认关联产品 ID
