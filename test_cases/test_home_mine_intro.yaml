name: "寨湾大屏【首页-矿山简介】深度巡检"
description: "覆盖首屏加载、视频播放测试、面板切换、文本语义检查、四大核心API数据断言，以及底部视角导航栏连通性测试"

steps:
  # 1. 智能等待：断言应用是否成功加载首页
  - type: wait_for
    prompt: "画面左上角完全显示出'寨湾磷矿智能矿山安全管控平台'的主标题，确认应用已成功进入首页"
    timeout: 30

  # 2. 视频播放检测（企业简介）
  - type: action
    prompt: "在画面左侧'企业简介'下方的深色视频播放区域中，点击正中央的巨大播放按钮或者左下角的小播放图标。注意：该目标严格位于画面左侧，绝对不要点击到画面右上角（例如'一键隐藏'按钮）。如果候选 DOM 列表中没有明确的视频控件，请务必返回 found=false，框架会自动降级使用纯视觉精确坐标点击！"
  - type: wait
    seconds: 2
  - type: assert
    prompt: "请仅仅作为一个视觉检测器：检查左侧的视频区域，确认画面正中央巨大的播放按钮是否已经【消失】，或者视频左下角控制栏是否出现了'暂停(两根竖线)'图标。只要满足任意一点，请直接判定断言成功 (True)，千万不要去推理视频到底有没有在动。"

  # 3. 互动测试：点击左上角的简介面板切换
  - type: action
    prompt: "在画面左上方信息面板的顶部，点击紧挨着'企业简介'右侧的'平台介绍'文本，切换标签卡。"

  # 4. 视频切换检测
  - type: wait
    seconds: 2
  - type: assert
    prompt: "严格检查左侧面板顶部的标签文本，确认原本的'平台介绍'是否已经变为了'入井须知'。只要能在左侧面板上方明确看到'入井须知'这几个字，即说明面板切换成功，请直接断言为 True。"

  # 5. 视频播放检测（平台介绍）
  - type: action
    prompt: "在左侧视频区域中，点击当前显示的'平台介绍'视频的播放按钮启动视频。同样，请严格在左侧区域寻找，如果 DOM 列表中没有对应的播放按钮，请返回 found=false 触发纯视觉模式点击，千万不要误点右上角。"
  - type: wait
    seconds: 2
  - type: assert
    prompt: "请仅仅作为一个视觉检测器：再次检查左侧视频区域，确认原本巨大的播放按钮是否已经【消失】，或者左下角出现了'暂停'图标。只要满足，请直接判定为 True，绝对不要去推理视频状态（因为 AI 经常误以为显示暂停图标就是暂停状态）。"

  # 6. 文本合理性检查（错别字检测）
  - type: assert
    prompt: "仔细阅读视频下方的大段企业或平台介绍的滚动文本。检查是否存在明显的错别字、乱码串，或者违背常识的错误表述。确认整体文字数据是否合理连贯。"

  # 7. 接口断言：左下角【矿山简介】
  - type: api_assert
    prompt: "在画面左下角的'矿山简介'模块中，提取显示的矿山名称、采矿权人、矿山地址、开采矿种、开采方式、生产规模和矿区面积等各项文本。前往最新拦截的底层 API JSON 数据中寻找'矿山简介'相关的接口数据，断言界面显示的文本与底层接口下发的数据是否完全一致。"

  # 8. 接口断言：右上角【作业人员】 (注：UI实际位置在右上角)
  - type: api_assert
    prompt: "在画面右上角寻找'作业人员'面板，提取显示的'带班领导'人名和'井下人员'总数。前往最新拦截的底层 API JSON 数据中寻找对应的人员与带班统计接口数据，断言 UI 渲染的名字和人数与底层数据是否完全一致。"

  # 9. 接口断言：右侧中间【最新核实资源量】
  - type: api_assert
    prompt: "在画面右侧寻找'最新核实资源量'面板，提取其中各项指标（证实、可信、推断、控制资源量等）的具体数值和品位百分比。前往最新拦截的 API JSON 数据中核对这些数值是否与底层接口下发的数据完全一致，且全屏无红色的严重报错。"

  # 10. 接口断言：右下角【矿石品级】
  - type: api_assert
    prompt: "在画面右下角寻找'矿石品级'图表模块，提取显示的各品级（I级品、II级品、III级品）的标准阈值百分比。前往拦截的 API JSON 数据中，断言界面显示的品级阈值是否与底层接口数据完全一致。"

  # 11. 互动测试：UE 视角切换（点击底部 Tab 栏，跳过最后两个漫游）
  # 11.1 智控中心
  - type: action
    prompt: "在底部居中的导航栏里，点击第二个标签'智控中心'（在矿山全貌的右侧）。"
  - type: wait
    seconds: 2
  - type: assert
    prompt: "警告：请绝对不要看屏幕顶部的菜单栏！必须只观察屏幕【最底部】的场景导航栏。确认底部的'智控中心'标签是否处于高亮选中状态，且画面主视角正常发生跳转。"

  # 11.2 智慧矿仓
  - type: action
    prompt: "在底部导航栏里，点击第三个标签'智慧矿仓'。"
  - type: wait
    seconds: 2
  - type: assert
    prompt: "警告：请绝对不要看屏幕顶部的菜单栏！必须只观察屏幕【最底部】的场景导航栏。确认底部的该标签是否处于高亮选中状态，且画面正常发生跳转。"

  # 11.3 地表办公室
  - type: action
    prompt: "在底部导航栏里，点击'地表办公室'标签。"
  - type: wait
    seconds: 2
  - type: assert
    prompt: "警告：请绝对不要看屏幕顶部的菜单栏！必须只观察屏幕【最底部】的场景导航栏。确认底部的'地表办公室'是否处于高亮选中状态，且画面正常发生跳转。"

  # 11.4 603主平硐
  - type: action
    prompt: "在底部导航栏里，点击'603主平硐'标签。"
  - type: wait
    seconds: 2
  - type: assert
    prompt: "警告：请绝对不要看屏幕顶部的菜单栏！必须只观察屏幕【最底部】的场景导航栏。确认底部的'603主平硐'是否处于高亮选中状态，且画面正常发生跳转。"

  # 11.5 725平硐
  - type: action
    prompt: "在底部导航栏里，点击'725平硐'标签。"
  - type: wait
    seconds: 2
  - type: assert
    prompt: "警告：请绝对不要看屏幕顶部的菜单栏！必须只观察屏幕【最底部】的场景导航栏。确认底部的'725平硐'是否处于高亮选中状态，且画面正常发生跳转。"

  # 11.6 603漫游
  - type: action
    prompt: "在底部导航栏里，点击'603漫游'标签。"
  - type: wait
    seconds: 3
  - type: action
    prompt: "在画面中下方的漫游控制条右侧，寻找倍速下拉按钮（'1x ▼'）。点击它一下以激活焦点。"
  - type: wait
    seconds: 1
  - type: action
    prompt: "在漫游控制条右侧，再次点击倍速下拉按钮（'1x ▼'），以展开倍速菜单。"
  - type: wait
    seconds: 3
  - type: action
    prompt: "在展开的倍速菜单中，找到并点击 '4x' 选项。"
    ignore_error: true
  - type: action
    prompt: "在漫游控制条的最左侧，寻找播放按钮（三角形）并点击它启动漫游。如果 DOM 列表中没有明确标示为'播放'的控件，请务必返回 found=false 以触发纯视觉预测。"
  - type: wait
    seconds: 2
  - type: assert
    prompt: "请仅仅作为一个视觉检测器：检查漫游控制条的最左侧，如果原来的播放按钮变成了'暂停(两根竖线)'图标，说明漫游视频正在正常播放，请直接判定为 True。"

  # 11.7 725漫游
  - type: action
    prompt: "在底部导航栏里，点击'725漫游'标签。"
  - type: wait
    seconds: 2
  - type: action
    prompt: "在画面中下方的漫游控制条右侧，寻找倍速下拉按钮（'1x ▼'）。点击它一下以激活焦点。"
  - type: wait
    seconds: 1
  - type: action
    prompt: "在漫游控制条右侧，再次点击倍速下拉按钮（'1x ▼'），以展开倍速菜单。"
  - type: wait
    seconds: 3
  - type: action
    prompt: "在展开的倍速菜单中，找到并点击 '4x' 选项。"
    ignore_error: true
  - type: action
    prompt: "在漫游控制条的最左侧，点击播放按钮（三角形）启动漫游。"
  - type: wait
    seconds: 2
  - type: assert
    prompt: "请仅仅作为一个视觉检测器：检查漫游控制条的最左侧，如果显示的是'暂停(两根竖线)'图标，说明漫游视频正在正常播放，请直接判定为 True。"
