name: 寨湾大屏【首页-矿山简介】与UE视角切换巡检
steps:
  # 1. 断言应用是否成功加载首页
  - type: assert
    prompt: "检查画面左上角是否有'寨湾磷矿智能矿山安全管控平台'的主标题，确认应用已成功进入首页"

  # 3. 互动测试：点击左上角的简介面板切换
  - type: action
    prompt: "在画面左上方信息面板的顶部，有一个黄色的'企业简介'文本。请点击紧挨着它右侧的第二个文本（显示为'平台介绍'）。请精准点击右侧的这个文本。"

  - type: wait
    seconds: 1

  - type: assert
    prompt: "请严格检查左侧面板顶部的第二个文本按钮，确认它的文字是否已经从'平台介绍'变成了'入井须知'。注意：不要管它有没有高亮状态，只要这个文本字面发生了变化，并且下方的视频内容切换了，就判断为 True。"  

  # 4. 互动测试：UE 视角切换（点击底部 Tab 栏）
  - type: action
    prompt: "在画面底部居中的导航栏里有一排共8个按钮。从左往右数，第二个按钮是'智控中心'（紧挨在第一个'矿山全貌'的右侧）。它的横向坐标大约在屏幕宽度的 35%~38% 左右，纵向在 83% 左右。请精准点击'智控中心'文字，千万不要点到最底下的字幕栏。"

  - type: assert
    prompt: "观察画面底部的导航栏，第二个按钮'智控中心'是否处于高亮/选中状态。"  

  # 5. 等待 UE 镜头漫游
  - type: wait
    seconds: 3

  # 6. 矿山铁律二：防假死检测，确认切换视角后 UI 和 3D 场景没有卡死
  - type: freeze_check
    prompt: "重点对比两张截图右上角的系统时间是否发生了推进，以及底部的跑马灯文字是否有位移。只要时间在正常走动或者画面有任何微小变化，即说明大屏正在正常运转（True）。不要因为 3D 场景或静态数据没变就判定为假死。"
    wait_seconds: 3

  # 7. 互动测试：切回默认全貌视角
  - type: action
    prompt: "在画面底部居中的导航栏里，最左侧第一个按钮是'矿山全貌'。它的横向坐标大约在屏幕宽度的 28%~30% 左右，纵向在 83% 左右。请精准点击它。"

  - type: wait
    seconds: 2

  - type: assert
    prompt: "观察画面底部的导航栏，最左侧的第一个按钮'矿山全貌'是否处于高亮/选中状态。"  

  # 8. 矿山铁律三：业务逻辑与渲染断言
  - type: assert
    prompt: "检查画面中央的 3D 地形是否正常渲染出山脉，以及右侧'最新核实资源量'等指标是否显示了正常的数字（不能是空值或明显的错误乱码），且全屏没有任何红色的报错提示框"
