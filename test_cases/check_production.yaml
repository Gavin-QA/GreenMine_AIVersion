name: 寨湾大屏首页与UE视角切换巡检
steps:
  # 1. 给定充足的时间等待程序启动加载动画，进入首页
  - type: wait
    seconds: 10

  # 2. 断言应用是否成功加载首页
  - type: assert
    prompt: "检查画面左上角是否有'寨湾磷矿智能矿山安全管控平台'的主标题，确认应用已成功进入首页"

  # 3. 互动测试：点击左上角的简介面板切换
  - type: action
    prompt: "在画面左侧偏上的位置，找到并点击'平台介绍'按钮（在'企业简介'旁边）"

  - type: wait
    seconds: 2

  # 4. 互动测试：UE 视角切换（点击底部 Tab 栏）
  - type: action
    prompt: "在画面正下方的视角控制 Tab 栏中，找到并点击'智控中心'按钮"

  # 5. 等待 UE 镜头漫游
  - type: wait
    seconds: 5

  # 6. 矿山铁律二：防假死检测，确认切换视角后 UI 和 3D 场景没有卡死
  - type: freeze_check
    prompt: "观察整个画面，特别是右侧的数据指标面板和中央的 UE 3D 场景，确认是否有轻微的动画、数据刷新或视角移动，防止大屏假死"
    wait_seconds: 5

  # 7. 互动测试：切回默认全貌视角
  - type: action
    prompt: "在画面正下方的视角控制 Tab 栏中，找到并点击'矿山全貌'按钮"

  - type: wait
    seconds: 3

  # 8. 矿山铁律三：业务逻辑与渲染断言
  - type: assert
    prompt: "检查画面中央的 3D 地形是否正常渲染出山脉，以及右侧'最新核实资源量'等指标是否显示了正常的数字（不能是空值或明显的错误乱码），且全屏没有任何红色的报错提示框"
