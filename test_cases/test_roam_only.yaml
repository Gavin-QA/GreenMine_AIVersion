name: "问题步骤单独排查 (Step 7, 14, 15, 49, 50)"
description: "将主流程中失败的步骤提取出来，方便单独运行与调试。"

steps:
  # ==========================================
  # 防护措施：刚启动时大屏可能在加载 3D 场景，UI 尚未渲染完毕
  # ==========================================
  - type: wait
    seconds: 5

  # ==========================================
  # 排查项 1：原 Step 7 (由于原 Step 5 点击失败导致)
  # ==========================================
  - type: action
    prompt: "在画面左上方信息面板的顶部，点击紧挨着'企业简介'右侧的'平台介绍'文本，切换标签卡。"
  - type: wait
    seconds: 2
  - type: assert
    prompt: "严格检查左侧面板顶部的标签文本，确认原本的'平台介绍'是否已经变为了'入井须知'。只要能在左侧面板上方明确看到'入井须知'这几个字，即说明面板切换成功，请直接断言为 True。"

  # ==========================================
  # 排查项 2：原 Step 14
  # “这AI怎么知道我哪个字段对应的值是多少啊，它都不会翻译一下”
  # ==========================================
  - type: api_assert
    prompt: "在画面右侧寻找'最新核实资源量'面板，提取其中各项指标（证实、可信、推断、控制资源量等）的具体数值和品位百分比。前往最新拦截的 API JSON 数据中，专门寻找接口名为 'getFdaConfigByKey' 的数据包，核对这些数值是否与该底层接口下发的数据完全一致，且全屏无红色的严重报错。"

  # ==========================================
  # 排查项 3：原 Step 15
  # “同一个接口，他就找不到了”
  # ==========================================
  - type: api_assert
    prompt: "在画面右下角寻找'矿石品级'图表模块，提取显示的各品级（I级品、II级品、III级品）的标准阈值百分比。前往拦截的 API JSON 数据中，专门寻找接口名为 'getFdaConfigByKey' 的数据包，断言界面显示的品级阈值是否与该接口数据完全一致。"

  # ==========================================
  # 排查项 4：原 Step 48, 49, 50 (725漫游播放测试)
  # 前置条件：必须先切入725漫游，否则找不到播放按钮
  # ==========================================
  - type: action
    prompt: "在底部导航栏里，点击'725漫游'标签。"
  - type: wait
    seconds: 2
  # 下方对应原有的 Step 48
  - type: action
    prompt: "在屏幕正下方的漫游控制条最左侧，点击播放按钮（三角形）启动漫游。"
  # 下方对应原有的 Step 49
  - type: wait
    seconds: 2
  # 下方对应原有的 Step 50
  - type: assert
    prompt: "请仅仅作为一个视觉检测器：检查漫游控制条的最左侧，如果显示的是'暂停(两根竖线)'图标，说明漫游视频正在正常播放，请直接判定为 True。"
